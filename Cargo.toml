[package]
name = "dragonbotz"
version = "3.0.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1.21"
tokio = {version = "1.53.1", features = ["rt-multi-thread"]}
tonic = "0.14.6"
tonic-prost = "0.14.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
yaml_serde = "0.10.4"

[build-dependencies]
tonic-build = "0.14.6"
tonic-prost-build = "0.14.6"
